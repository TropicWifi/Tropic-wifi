<!DOCTYPE html>
<html lang="ht">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tropic Wi-Fi - Site Tropicana</title>
    <style>
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: linear-gradient(135deg, #0f172a, #1e293b); color: white; margin: 0; padding: 16px; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .card { background: rgba(30, 41, 59, 0.95); border: 1px solid #334155; padding: 24px; border-radius: 20px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .logo { font-size: 40px; margin-bottom: 5px; }
        h1 { color: #38bdf8; font-size: 24px; margin: 0; }
        .sub { color: #94a3b8; font-size: 14px; margin: 4px 0 20px; }
        input { width: 100%; padding: 15px; border-radius: 12px; border: 2px solid #334155; background: #0f172a; color: #38bdf8; font-size: 22px; font-weight: bold; text-align: center; text-transform: uppercase; letter-spacing: 4px; margin-bottom: 12px; }
        input:focus { outline: none; border-color: #38bdf8; }
        .btn-main { width: 100%; padding: 15px; background: #38bdf8; color: #0f172a; border: none; border-radius: 12px; font-size: 17px; font-weight: 800; cursor: pointer; }
        .btn-free { width: 100%; padding: 12px; background: transparent; color: #34d399; border: 1px solid #34d399; border-radius: 12px; font-size: 15px; font-weight: bold; margin-top: 10px; cursor: pointer; }
        .alert { padding: 12px; border-radius: 10px; margin-top: 15px; font-size: 14px; line-height: 1.4; }
        .success { background: #065f46; color: #a7f3d0; border: 1px solid #10b981; }
        .error { background: #7f1d1d; color: #fecaca; border: 1px solid #ef4444; }
        .tarif { margin-top: 22px; background: #0f172a; padding: 15px; border-radius: 14px; text-align: left; }
        .tarif h3 { margin: 0 0 10px; font-size: 14px; color: #38bdf8; text-transform: uppercase; }
        .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #1e293b; font-size: 15px; }
        .row:last-child { border-bottom: none; }
        .price { font-weight: bold; color: #34d399; }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">📶</div>
        <h1>Tropic Wi-Fi</h1>
        <div class="sub">Entènèt Rapid • Site Tropicana, Limonade</div>

        <form method="POST">
            <input type="text" name="code" placeholder="KÒD KAT LA" maxlength="10" required>
            <button type="submit" class="btn-main">Konekte Kounye a</button>
        </form>

        <form method="POST">
            <input type="hidden" name="action" value="free_trial">
            <button type="submit" class="btn-free">🎁 Eseye 10 Minit Gratis</button>
        </form>

        {% if message %}
            <div class="alert {{ status_type }}">
                {{ message }}
                {% if remaining_time %}<br><strong>⏳ Tan : {{ remaining_time }}</strong>{% endif %}
            </div>
        {% endif %}

        <div class="tarif">
            <h3>💰 Pri Plan Wi-Fi yo</h3>
            <div class="row"><span>1 Èdtan</span> <span class="price">25 HTG</span></div>
            <div class="row"><span>24 Èdtan (1 Jou)</span> <span class="price">75 HTG</span></div>
            <div class="row"><span>7 Jou (1 Semèn)</span> <span class="price">400 HTG</span></div>
            <div class="row"><span>30 Jou (1 Mwa)</span> <span class="price">1,250 HTG</span></div>
        </div>
    </div>
</body>
</html>
